name: Legal audit 2026-10-14
on:
  push:
    branches: [audit/legal-2026-10-14]
    paths:
      - .github/workflows/legal-audit-20261014.yml
      - 06_scripts/audit_2026_10_14.py
      - 06_scripts/audit_payload_20261014.xz.*
permissions:
  contents: write
concurrency:
  group: legal-audit-20261014
  cancel-in-progress: true
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/legal-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checksum-verified correction package
        run: python 06_scripts/audit_2026_10_14.py
      - name: Regenerate and validate source-linked evidence
        run: |
          pip install -r 06_scripts/requirements-audit.txt
          python 06_scripts/build_tables/build_network.py
          python 06_scripts/build_tables/spar_normtrace_bridge.py
          python 06_scripts/build_tables/build_audit_manifest.py
          python 06_scripts/validation/validate_content.py
          python -m unittest discover -s 06_scripts/validation -p 'test_audit_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_webapp/package-lock.json
      - name: Install locked frontend dependencies and build
        working-directory: 05_webapp
        run: |
          npm ci 2>&1 | tee /tmp/audit-install.log
          npm run build 2>&1 | tee /tmp/audit-build.log
      - name: Install Chromium
        working-directory: 05_webapp
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: 05_webapp
        run: npx playwright test tests/audit_20261014.spec.ts --reporter=list 2>&1 | tee /tmp/audit-browser.log
      - name: Commit tested corrections to audit branch only
        run: |
          test "$GITHUB_REF" = refs/heads/audit/legal-2026-10-14
          remote_head=$(git ls-remote origin refs/heads/audit/legal-2026-10-14 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          rm 06_scripts/audit_2026_10_14.py 06_scripts/audit_payload_20261014.xz.* .github/workflows/legal-audit-20261014.yml
          git config user.name 'NormTrace audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat | tee /tmp/audit-change-summary.log
          git commit -m 'fix(audit): correct legal evidence, withhold unresolved scores and rebuild traceability UI'
          git push origin HEAD:refs/heads/audit/legal-2026-10-14
          git rev-parse HEAD | tee /tmp/audit-tested-commit.txt
      - name: Export current working source for inspection
        if: always()
        run: |
          git add -A
          git archive --format=zip --output=/tmp/normtrace-audited-source.zip "$(git write-tree)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normtrace-audit-evidence
          path: |
            /tmp/normtrace-audited-source.zip
            /tmp/audit-*.log
            /tmp/audit-tested-commit.txt
            05_webapp/audit-screenshots
            05_webapp/test-results
            05_webapp/dist
          retention-days: 14
