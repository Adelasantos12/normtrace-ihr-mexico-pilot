name: Validate

on:
  push:
  pull_request:

jobs:
  content-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python pipeline deps
        run: pip install networkx pandas numpy statsmodels

      - name: Regenerate network + SPAR-bridge + MRQAP artifacts
        run: |
          python3 06_scripts/build_tables/build_network.py
          python3 06_scripts/build_tables/spar_normtrace_bridge.py
          python3 06_scripts/build_tables/mrqap_anchoring.py

      - name: Validate content (corpus counts, edge integrity, paper reconciliation, no hard-coded degrees)
        run: python3 06_scripts/validation/validate_content.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 05_webapp/package-lock.json

      - name: Install webapp deps
        working-directory: 05_webapp
        run: npm install

      - name: Build webapp
        working-directory: 05_webapp
        run: npm run build

      - name: Fail if the pipeline left uncommitted diffs
        run: |
          git diff --stat
          git diff --quiet -- 04_outputs 05_webapp/public/data/derived || {
            echo "::error::build_network.py / spar_normtrace_bridge.py output differs from what's committed. Re-run the pipeline locally and commit the regenerated files.";
            exit 1;
          }
