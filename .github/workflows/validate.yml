name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  content-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible graph dependency
        run: pip install -r 06_scripts/requirements-audit.txt
      - name: Regenerate current derived outputs
        run: |
          python 06_scripts/build_tables/build_network.py
          python 06_scripts/build_tables/spar_normtrace_bridge.py
          python 06_scripts/build_tables/build_audit_manifest.py
      - name: Validate corrected data and invariants
        run: |
          python 06_scripts/validation/validate_content.py
          python -m unittest discover -s 06_scripts/validation -p 'test_audit_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_webapp/package-lock.json
      - name: Install locked frontend dependencies and build
        working-directory: 05_webapp
        run: npm ci && npm run build
      - name: Install Chromium
        working-directory: 05_webapp
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        working-directory: 05_webapp
        run: npx playwright test tests/audit_20261014.spec.ts --reporter=list
      - name: Check generated output is committed
        run: git diff --exit-code -- 04_outputs 05_webapp/public/data/derived
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-browser-evidence
          path: |
            05_webapp/audit-screenshots
            05_webapp/test-results
          retention-days: 14
