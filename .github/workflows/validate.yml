name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python pipeline dependencies
        run: pip install networkx==3.5 pandas
      - name: Regenerate current evidence, graph and SPAR context
        run: |
          if [ -f 06_scripts/build_tables/build_audit_release.py ]; then
            python3 06_scripts/build_tables/build_audit_release.py
          fi
          python3 06_scripts/build_tables/build_network.py
          python3 06_scripts/build_tables/spar_normtrace_bridge.py
      - name: Validate source integrity and current claims
        run: python3 06_scripts/validation/validate_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_webapp/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: 05_webapp
        run: npm ci
      - name: Build frontend
        working-directory: 05_webapp
        run: npm run build
      - name: Install browser for evidence regression tests
        if: hashFiles('05_webapp/tests/audit-regression.spec.ts') != ''
        working-directory: 05_webapp
        run: npx playwright install --with-deps chromium
      - name: Verify evidence routes and desktop/mobile layouts
        if: hashFiles('05_webapp/tests/audit-regression.spec.ts') != ''
        working-directory: 05_webapp
        run: npx playwright test tests/audit-regression.spec.ts --project=chromium
      - name: Reject stale generated artifacts
        run: |
          git diff --stat
          git diff --exit-code -- 04_outputs 05_webapp/public/data/derived 05_webapp/public/data/*_clean.csv 05_webapp/public/data/normtrace_evidence_v0_2.zip
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('05_webapp/tests/audit-regression.spec.ts') != ''
        with:
          name: evidence-browser-tests
          path: |
            05_webapp/test-results/
            05_webapp/playwright-report/
          retention-days: 7
