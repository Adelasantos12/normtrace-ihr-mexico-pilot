name: Legal evidence audit review

on:
  push:
    branches: [audit/legal-evidence-2026-10-14]
    paths:
      - .github/workflows/audit-review.yml
      - 06_scripts/maintenance/**

permissions:
  contents: write

concurrency:
  group: normtrace-legal-evidence-migration
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/legal-evidence-2026-10-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic graph dependency
        run: pip install networkx==3.5
      - name: Apply hash-pinned source corrections with original-data archive
        run: python3 06_scripts/maintenance/apply_audit_bundle.py
      - name: Regenerate and validate all current data
        run: |
          python3 06_scripts/build_tables/build_audit_release.py
          python3 06_scripts/build_tables/build_network.py
          python3 06_scripts/build_tables/spar_normtrace_bridge.py
          python3 06_scripts/validation/validate_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_webapp/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: 05_webapp
        run: npm ci
      - name: Build frontend
        working-directory: 05_webapp
        run: npm run build
      - name: Install Chromium
        working-directory: 05_webapp
        run: npx playwright install --with-deps chromium
      - name: Exercise current evidence routes and capture desktop/mobile screenshots
        working-directory: 05_webapp
        run: npx playwright test tests/audit-regression.spec.ts --project=chromium
      - name: Commit expanded correction only after all checks pass
        run: |
          git diff --check -- 00_project 03_tables 04_outputs 05_webapp/src 06_scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_project 03_tables 04_outputs/exports 04_outputs/figures 05_webapp/public/data 05_webapp/src 05_webapp/tests/audit-regression.spec.ts 06_scripts/build_tables 06_scripts/validation 99_archive/legal_audit_2026-10-14
          if ! git diff --cached --quiet; then
            git commit -m 'fix(audit): correct legal evidence, preserve original coding, remove unsupported scores and rebuild traceability'
            git push origin HEAD:audit/legal-evidence-2026-10-14
          fi
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git archive --format=zip HEAD -o normtrace-corrected-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normtrace-legal-audit-results
          path: |
            normtrace-corrected-source.zip
            05_webapp/test-results/
            05_webapp/playwright-report/
            04_outputs/exports/audit_manifest.json
            00_project/audit_2026-10-14/migration_applied.json
          retention-days: 7
